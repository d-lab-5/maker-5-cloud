<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- maker5.cloud: a power core, hot-rod red and gold, glowing at the centre -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#bff4ff"/>
      <stop offset=".7" stop-color="#38bdf8" stop-opacity=".85"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd970"/>
      <stop offset="1" stop-color="#e0a100"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e53125"/>
      <stop offset="1" stop-color="#8f0f10"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#red)"/>
  <circle cx="32" cy="32" r="24" fill="#1a0708"/>
  <!-- the gold ring in eight segments -->
  <circle cx="32" cy="32" r="20.5" fill="none" stroke="url(#gold)" stroke-width="5"
          stroke-dasharray="13.1 3" transform="rotate(-11 32 32)"/>
  <circle cx="32" cy="32" r="14.5" fill="none" stroke="#e53125" stroke-width="2"/>
  <circle cx="32" cy="32" r="13" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="5" fill="#ffffff"/>
</svg>
